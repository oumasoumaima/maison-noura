name: maison-noura

services:
  # ---------- Infrastructure ----------
  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: noura
      POSTGRES_PASSWORD: noura
    ports: ["5433:5432"]
    volumes: [catalog-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noura -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: noura
      POSTGRES_PASSWORD: noura
    ports: ["5434:5432"]
    volumes: [booking-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noura -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]   # UI : http://localhost:15672 (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:                                 # faux serveur mail : boîte de réception sur http://localhost:8025
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin                 # console d'admin Keycloak : http://localhost:8090 (admin/admin)
      KEYCLOAK_ADMIN_PASSWORD: admin
      # "localhost:8090" est l'adresse publique fixe utilisée dans le champ "iss" (issuer) des tokens,
      # que la requête vienne du navigateur ou d'un conteneur — voir SecurityConfig des services Java.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8090"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports: ["8090:8080"]
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/maison-noura HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 200 <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------- Services métier ----------
  catalog-service:
    build: ./catalog-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/catalog
      SPRING_DATASOURCE_USERNAME: noura
      SPRING_DATASOURCE_PASSWORD: noura
      KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/maison-noura
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/maison-noura/protocol/openid-connect/certs
    ports: ["8081:8081"]
    depends_on:
      catalog-db: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  booking-service:
    build: ./booking-service
    environment:
      TZ: Africa/Casablanca
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/booking
      SPRING_DATASOURCE_USERNAME: noura
      SPRING_DATASOURCE_PASSWORD: noura
      SPRING_RABBITMQ_HOST: rabbitmq
      BOOKING_CATALOG_URL: http://catalog-service:8081
      KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/maison-noura
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/maison-noura/protocol/openid-connect/certs
    ports: ["8082:8082"]
    depends_on:
      booking-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      catalog-service: { condition: service_started }
      keycloak: { condition: service_healthy }

  notification-service:
    build: ./notification-service
    environment:
      TZ: Africa/Casablanca
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
    depends_on:
      rabbitmq: { condition: service_healthy }
      mailhog: { condition: service_started }

  api-gateway:
    build: ./api-gateway
    environment:
      CATALOG_URI: http://catalog-service:8081
      BOOKING_URI: http://booking-service:8082
      KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/maison-noura
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/maison-noura/protocol/openid-connect/certs
    ports: ["8080:8080"]
    depends_on:
      - catalog-service
      - booking-service
      - keycloak

volumes:
  catalog-data:
  booking-data:
